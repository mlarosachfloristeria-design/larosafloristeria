<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Rosa Floristería</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#fff8fa,#ffeef3);
    color:#333;
}

/* Barra */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:90px;
    background:white;
    box-shadow:0 3px 15px rgba(0,0,0,.12);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

header img{
    height:60px;
}

/* Principal */

.hero{
    min-height:100vh;
    padding-top:120px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding-left:20px;
    padding-right:20px;
}

.hero h1{
    font-size:50px;
    color:#7d2346;
    margin-bottom:15px;
}

.hero p{
    font-size:22px;
    max-width:700px;
    line-height:1.6;
    color:#666;
}

.catalogo{
    margin-top:45px;
}

.catalogo a{
    display:inline-block;
    text-decoration:none;
    background:#b71c5a;
    color:white;
    padding:18px 45px;
    border-radius:50px;
    font-size:22px;
    transition:.3s;
    box-shadow:0 10px 25px rgba(183,28,90,.3);
}

.catalogo a:hover{
    background:#96154a;
    transform:translateY(-3px);
}

/* Whatsapp */

.whatsapp{

position:fixed;
bottom:25px;
right:25px;
width:70px;
height:70px;
border-radius:50%;
background:#25D366;
display:flex;
justify-content:center;
align-items:center;
text-decoration:none;
font-size:38px;
color:white;
box-shadow:0 10px 25px rgba(0,0,0,.25);
transition:.3s;
z-index:999;
}

.whatsapp:hover{
transform:scale(1.08);
}

footer{
margin-top:70px;
padding:30px;
text-align:center;
color:#888;
font-size:14px;
}

@media(max-width:700px){

header{
height:80px;
}

header img{
height:50px;
}

.hero h1{
font-size:34px;
}

.hero p{
font-size:18px;
}

.catalogo a{
font-size:18px;
padding:15px 30px;
}

}
</style>

</head>

<body>

<header>

<img src="images/logonegro.png" alt="La Rosa Floristería">

</header>

<section class="hero">

<h1>La Rosa Floristería</h1>

<p>

Detalles florales diseñados para expresar amor, gratitud y los momentos más especiales de la vida.

</p>

<div class="catalogo">

<a href="images/Catálogo.pdf" target="_blank">

Ver catálogo

</a>

</div>

</section>

<footer>

© 2026 La Rosa Floristería

</footer>

<a class="whatsapp"
href="https://wa.me/593984202840"
target="_blank">

💬

</a>

</body>
</html>
